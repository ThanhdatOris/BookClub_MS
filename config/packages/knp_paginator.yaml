knp_paginator:
    page_range: 5                      # Số trang hiển thị trong thanh phân trang (mặc định: 5)
    default_options:
        page_name: page                # Tên tham số page trong query string (mặc định: page)
        sort_field_name: sort          # Tên tham số sort trong query string
        sort_direction_name: direction # Tên tham số direction trong query string
        distinct: true                 # Đảm bảo không có bản ghi trùng lặp
    template:
        pagination: '@KnpPaginator/Pagination/twitter_bootstrap_v4_pagination.html.twig' # Template phân trang
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'                     # Template cho cột sắp xếp