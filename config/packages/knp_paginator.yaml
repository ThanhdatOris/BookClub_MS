knp_paginator:
    page_range: 5                      # Số trang hiển thị trong thanh phân trang (mặc định: 5)
    default_options:
        page_name: page                # Tên tham số page trong query string (mặc định: page)
        sort_field_name: sort          # Tên tham số sort trong query string
        sort_direction_name: direction # Tên tham số direction trong query string
        distinct: true                 # Đảm bảo không có bản ghi trùng lặp
        default_limit: 10              # default number of items per page
        filter_field_name: filterField  # filter field query parameter name
        filter_value_name: filterValue  # filter value query parameter name
        page_out_of_range: ignore       # ignore, fix, or throwException when the page is out of range

    template:
        pagination: 'pagination/custom_pagination.html.twig'     # Template phân trang tùy chỉnh
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'     # Template cho cột sắp xếp
        filtration: '@KnpPaginator/Pagination/filtration.html.twig'      # Template cho bộ lọc
