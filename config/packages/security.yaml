security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Định nghĩa provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: student_id # Sửa từ 'mail' thành 'student_id' (hoặc 'email' nếu bạn muốn dùng email)

    # Định nghĩa firewall
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator:
                - App\Security\GoogleAuthenticator
            logout:
                path: logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 tuần
                path: /
                always_remember_me: true # Tự động nhớ user

    # Phân quyền
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/student-id, roles: PUBLIC_ACCESS } # Cho phép truy cập để nhập studentId ban đầu
        - { path: ^/update-student-id, roles: ROLE_MEMBER } # Chỉ user đã đăng nhập mới cập nhật studentId
        - { path: ^/dashboard, roles: [ROLE_MEMBER, ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/users, roles: ROLE_ADMIN }
        - { path: ^/activities, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/attendances, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/activity_participant, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/funds, roles: [ROLE_ADMIN, ROLE_TREASURER] } # Cho phép cả ROLE_ADMIN truy cập quỹ
        - { path: ^/proposals, roles: [ROLE_MEMBER, ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/proposals/delete, roles: ROLE_ADMIN, methods: [POST] } # Chỉ ROLE_ADMIN được xóa đề xuất
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_MEMBER, ROLE_TREASURER] # ROLE_ADMIN kế thừa cả ROLE_TREASURER
        ROLE_TREASURER: [ROLE_MEMBER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon