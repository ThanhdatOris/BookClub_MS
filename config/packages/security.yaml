security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator:
                - App\Security\GoogleAuthenticator
            logout:
                path: logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                always_use_default_target_path: true

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/update-student-id, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/dashboard, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/members, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/activities, roles: PUBLIC_ACCESS }
        - { path: ^/attendances, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/activity_participant, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/funds/\d+/edit, roles: [ROLE_TREASURER] }
        - { path: ^/funds/\d+$, roles: [ROLE_TREASURER], methods: [POST] }
        - { path: ^/funds, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/proposals, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/profile, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_MEMBER]
        ROLE_TREASURER: [ROLE_MEMBER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
