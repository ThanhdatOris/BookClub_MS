security:

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    enable_authenticator_manager: true

    # Định nghĩa provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: mail

    # Định nghĩa firewall
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            logout:
                path: logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 tuần
                path: /

    # Phân quyền
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: [ROLE_MEMBER, ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/users, roles: ROLE_ADMIN }
        - { path: ^/activities, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/attendances, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/activity_participant, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/funds, roles: ROLE_TREASURER }
        - { path: ^/proposals, roles: [ROLE_MEMBER, ROLE_ADMIN, ROLE_TREASURER] }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_MEMBER]
        ROLE_TREASURER: [ROLE_MEMBER]

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
