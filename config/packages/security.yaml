security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Định nghĩa provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email # Sửa từ 'mail' thành 'email'

    # Định nghĩa firewall
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator:
                - App\Security\GoogleAuthenticator
            logout:
                path: logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 tuần
                path: /

    # Phân quyền
    access_control:
        # - { path: ^/login, roles: PUBLIC_ACCESS }
        # - { path: ^/register, roles: PUBLIC_ACCESS }
        # - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        # - { path: ^/update-student-id, roles: IS_AUTHENTICATED_FULLY } # Thêm phân quyền cho route update-student-id
        # - { path: ^/dashboard, roles: [ROLE_MEMBER, ROLE_ADMIN, ROLE_TREASURER] }
        # - { path: ^/users, roles: ROLE_ADMIN }
        # - { path: ^/activities, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        # - { path: ^/attendances, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        # - { path: ^/activity_participant, roles: [ROLE_ADMIN, ROLE_TREASURER] }
        # - { path: ^/funds, roles: ROLE_TREASURER }
        # - { path: ^/proposals, roles: [ROLE_MEMBER, ROLE_ADMIN, ROLE_TREASURER] }
        # - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: PUBLIC_ACCESS }
        
    role_hierarchy:
        ROLE_ADMIN: [ROLE_MEMBER]
        ROLE_TREASURER: [ROLE_MEMBER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon